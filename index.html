<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F2EB">
<title>나만의 경제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9F2EB; --outer: #DCE7DF; --card: #FFFFFF; --ink: #13261C; --sub: #4A5A50; --line: #D6E3DA;
    --soft: #F4F8F5; --green: #1C7C54; --green-ink: #FFFFFF; --mint: #D5EEE1; --yellow: #FFD84D;
    --up: #C22B2B; --up-bg: #FDECEC; --down: #1C5FB8; --down-bg: #EAF1FC; --flat-bg: #EEF2EF;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--outer); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hand { font-family: 'Gowun Dodum', sans-serif; }
  .strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }

  .phone { max-width: 440px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  .scroll { flex: 1; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 16px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px 12px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .avatar { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 4px; border: none; background: transparent; cursor: pointer; border-radius: 14px; }
  .avatar:hover { background: rgba(255,255,255,0.6); }
  .brand { font-size: 18px; font-weight: 700; }
  .icon-btn { width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 14px; }
  .icon-btn:hover { background: rgba(255,255,255,0.6); }
  .asof { font-size: 12px; color: var(--sub); }

  .hero { display: flex; align-items: flex-end; gap: 10px; padding-top: 4px; }
  .bubble { flex: 1; background: var(--card); border-radius: 20px 20px 20px 6px; padding: 14px 12px 6px 16px; display: flex; flex-direction: column; gap: 4px; }
  .bubble p { margin: 0; font-size: 16px; line-height: 1.6; min-height: 51px; }
  .bubble-foot { display: flex; justify-content: space-between; align-items: center; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.on { background: var(--green); width: 14px; }
  .link-btn { min-height: 40px; padding: 0 6px 0 10px; border: none; background: transparent; color: var(--green); font-size: 13px; font-weight: 700; cursor: pointer; }

  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .sec-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; }
  .sec-title h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .sec-title span, .hint { font-size: 12px; color: var(--sub); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 7px; }
  .b-up { color: var(--up); background: var(--up-bg); }
  .b-down { color: var(--down); background: var(--down-bg); }
  .b-flat { color: var(--sub); background: var(--flat-bg); }
  .b-green { color: var(--green); background: #E1F2E8; }
  .b-sample { color: #8A5A00; background: #FFF1C9; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--sub); }

  .mkt { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mkt div { background: var(--card); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .mkt .k { font-size: 12px; color: var(--sub); }
  .mkt .v { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .mkt .c { font-size: 12px; font-weight: 700; }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; border-top: 1px solid #EEF2EF; }
  .row:first-child { border-top: none; }
  .row .name { font-size: 15px; font-weight: 700; }
  .row .sub { font-size: 12px; color: var(--sub); }

  .impact { flex-shrink: 0; width: 232px; background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; border: none; font-size: inherit; }
  .impact p { margin: 0; font-size: 14px; line-height: 1.55; }
  .bleed { margin: 0 -16px; padding: 0 16px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #BFD3C6; background: var(--card); font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.small { min-height: 32px; font-size: 12px; font-weight: 500; padding: 0 12px; }

  .news a { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #EEF2EF; }
  .news a:first-child { border-top: none; padding-top: 4px; }
  .news .no { font-family: 'Gowun Dodum', sans-serif; font-size: 18px; font-weight: 700; color: var(--green); width: 16px; flex-shrink: 0; line-height: 1.4; }
  .news .t { font-size: 15px; font-weight: 500; line-height: 1.45; }
  .news .m { font-size: 12px; color: var(--sub); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
  .news a:hover .t { color: var(--green); }

  .cal { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #EEF2EF; }
  .cal:first-child { border-top: none; }
  .dday { width: 52px; flex-shrink: 0; text-align: center; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 6px 0; background: var(--soft); color: var(--sub); }
  .dday.soon { background: var(--green); color: #fff; }
  .cal .t { font-size: 14px; font-weight: 700; }
  .cal .d { font-size: 12px; color: var(--sub); }
  .cal.mine .t { color: var(--green); }

  .benefit { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px; border-top: 1px solid #EEF2EF; padding: 8px 0; }
  .benefit:first-child { border-top: none; }
  .benefit .t { font-size: 14px; font-weight: 700; }
  .benefit .d { font-size: 12px; color: var(--sub); margin-top: 2px; line-height: 1.45; }

  .quiz { background: var(--green); color: var(--green-ink); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .quiz .q { font-size: 15px; font-weight: 500; line-height: 1.55; margin: 0; }
  .ox { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ox button { min-height: 50px; border-radius: 14px; border: none; font-size: 20px; font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.16); color: #fff; }
  .ox button.right { background: #fff; color: var(--green); }
  .ox button.dim { background: rgba(255,255,255,0.08); color: #9CCBB2; }
  .ox button.wrong { background: rgba(255,255,255,0.08); color: #FFC9C9; text-decoration: line-through; }
  .quiz .ex { margin: 0; font-size: 13px; line-height: 1.65; color: #E6F5EC; }

  .more { background: var(--card); border: 2px dashed #BFD3C6; border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .more .q { font-size: 15px; font-weight: 700; margin: 0; }
  .inline { display: flex; gap: 8px; }
  .field { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font-size: 15px; background: var(--card); width: 100%; min-width: 0; }
  .field:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: var(--green); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
  .btn.block { width: 100%; min-height: 52px; font-size: 16px; border-radius: 16px; }
  .btn.danger { background: #FDECEC; color: #A61B1B; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .foot { font-size: 11px; color: var(--sub); line-height: 1.6; text-align: center; padding: 4px 8px 8px; }

  .askbar { position: sticky; bottom: 0; z-index: 6; padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .askform { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 18px; padding: 6px 6px 6px 16px; }
  .askform input { flex: 1; min-width: 0; border: none; outline: none; font-size: 15px; background: transparent; }
  .askform input::placeholder { color: #5E6E64; }
  .send { width: 44px; height: 44px; border-radius: 13px; border: none; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  .sheet-back { position: fixed; inset: 0; background: rgba(19, 38, 28, 0.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 440px; max-height: 80vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .sheet .qline { align-self: flex-end; background: var(--ink); color: #fff; border-radius: 18px 18px 6px 18px; padding: 10px 14px; font-size: 14px; max-width: 85%; }
  .sheet .ans { display: flex; gap: 10px; align-items: flex-start; }
  .sheet .ans p { margin: 0; background: var(--card); border-radius: 6px 18px 18px 18px; padding: 12px 14px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; flex: 1; }

  .toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 999px; z-index: 30; max-width: 90vw; }

  /* 마이페이지 / 첫 설문 */
  .page-head { display: flex; align-items: center; gap: 4px; padding: 14px 12px 6px 4px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .page-head h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .form { display: flex; flex-direction: column; gap: 12px; }
  .form label.lb { font-size: 13px; font-weight: 700; color: var(--sub); display: block; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .range { width: 100%; accent-color: var(--green); height: 32px; }
  .range-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
  .type-pill { font-size: 13px; font-weight: 700; color: var(--green); }
  .money { position: relative; }
  .money .field { padding-right: 44px; text-align: right; }
  .money .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--sub); pointer-events: none; }
  .debt { background: var(--soft); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .bar { height: 10px; border-radius: 5px; background: var(--flat-bg); display: flex; overflow: hidden; }
  .diag { display: flex; flex-direction: column; gap: 10px; }
  .diag-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.55; }
  .diag-line .badge { flex-shrink: 0; margin-top: 2px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

  .onb { padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .onb h1 { margin: 0; font-size: 24px; line-height: 1.4; font-weight: 700; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .steps i.on { background: var(--green); }
  .results { display: flex; flex-direction: column; background: var(--card); border-radius: 12px; overflow: hidden; }
  .results button { min-height: 44px; border: none; border-top: 1px solid #EEF2EF; background: transparent; text-align: left; padding: 0 14px; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .results button:first-child { border-top: none; }
  .results button:hover { background: var(--soft); }

  /* 상단 검색 */
  .searchwrap { padding: 0 16px 8px; position: sticky; top: 62px; z-index: 6; background: var(--bg); }
  .searchbox { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 16px; padding: 0 6px 0 14px; min-height: 48px; border: 1.5px solid transparent; }
  .searchbox:focus-within { border-color: var(--green); }
  .searchbox input { flex: 1; min-width: 0; border: none; outline: none; font-size: 15px; background: transparent; min-height: 44px; }
  .searchbox input::placeholder { color: #5E6E64; }
  .sresults { display: none; position: absolute; left: 16px; right: 16px; top: 56px; background: var(--card); border-radius: 16px; box-shadow: 0 12px 32px rgba(19,38,28,0.18); max-height: 62vh; overflow-y: auto; padding: 6px 0; }
  .searchwrap.open .sresults:not(:empty) { display: block; }
  .sg { font-size: 11px; font-weight: 700; color: var(--sub); padding: 8px 14px 2px; }
  .si { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 14px; border: none; background: transparent; text-align: left; font-size: 14px; cursor: pointer; }
  .si:hover, .si:focus-visible { background: var(--soft); }
  .si .s2 { font-size: 12px; color: var(--sub); }
  .si.ask { color: var(--green); font-weight: 700; border-top: 1px solid #EEF2EF; margin-top: 4px; }
  .def { padding: 6px 14px 10px; font-size: 13px; line-height: 1.6; }

  /* 시세 타일 (지수·환율·내 종목 같은 모양) */
  .mkt { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mkt .k { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mkt .add { border: 1.5px dashed #BFD3C6; background: transparent; justify-content: center; cursor: pointer; color: var(--sub); font-size: 13px; font-weight: 700; min-height: 74px; border-radius: 16px; }

  /* 뉴스 한 줄 */
  .nl a { display: flex; align-items: center; gap: 8px; min-height: 40px; border-top: 1px solid #EEF2EF; font-size: 14px; }
  .nl a:first-child { border-top: none; }
  .nl .t1 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .nl .src { font-size: 11px; color: var(--sub); flex-shrink: 0; }
  .nl a:hover .t1 { color: var(--green); }
  .plus { min-width: 44px; min-height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); font-size: 13px; font-weight: 700; cursor: pointer; padding: 0 10px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .chip { flex-shrink: 0; }
  .cal .tagc { font-size: 10px; font-weight: 700; color: var(--green); background: #E1F2E8; border-radius: 5px; padding: 2px 5px; margin-right: 4px; }
  .dday.approx { background: #FFF1C9; color: #7A5200; }
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script>
// ───────────────────────── 저장 (이 기기에만) ─────────────────────────
const STORE_KEY = "myeco.profile.v1";
const UI_KEY = "myeco.ui.v1";

function loadProfile() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; }
}
function saveProfile() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(profile)); } catch {}
}
function loadUi() {
  try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch { return {}; }
}
function saveUi() {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ hideMoney: ui.hideMoney, quiz: ui.quiz })); } catch {}
}

let profile = loadProfile();
const data = { market: null, news: null, newsFull: null, rates: null, calendar: [], benefits: [], loading: false };
const ui = {
  bubble: 0, q: "", sremote: [], searchOpen: false, sheet: null,
  news: { tab: "issues", kwItems: {} },
  hideMoney: false, quiz: null, // quiz: { day, pick }
  onb: { step: 0, draft: null }, search: { q: "", results: [], sample: false },
  ...loadUi(),
};

// ───────────────────────── 상수 ─────────────────────────
const PREFS = ["쇼핑", "여행", "음식", "자기계발", "저축", "부동산", "취미"];
const POPULAR = ["삼성전자", "SK하이닉스", "LG에너지솔루션", "현대차", "NAVER", "카카오", "셀트리온", "KB금융"];
const LETTERS = [
  { id: "uppity", name: "머니레터", by: "어피티", url: "https://uppity.co.kr" },
  { id: "newneek", name: "뉴닉", by: "NEWNEEK", url: "https://newneek.co" },
];
const INCOME = ["", "~3천만원", "3천~5천만원", "5천~7,500만원", "7,500만원~"];
const INCOME_MONTHLY = [0, 210, 330, 520, 750]; // 구간별 대략 월 소득(만원), 비상금 진단용
// 위험기피 점수(1=위험 괜찮음 … 10=절대 싫음) → 금융투자협회 5단계 투자성향 이름
function riskType(a) {
  if (a >= 9) return "안정형";
  if (a >= 7) return "안정추구형";
  if (a >= 5) return "위험중립형";
  if (a >= 3) return "적극투자형";
  return "공격투자형";
}
// 성향별로 흔히 쓰는 투자자산 비중 참고치 (일반 기준, 투자 권유 아님)
function investGuide(a) {
  if (a >= 9) return [0, 10];
  if (a >= 7) return [10, 30];
  if (a >= 5) return [30, 50];
  if (a >= 3) return [50, 70];
  return [60, 90];
}

const GLOSSARY = [
  { term: "기준금리", alias: ["금리"], def: "한국은행이 정하는 기준이 되는 금리예요. 오르면 대출·예금 금리도 따라 오르는 경향이 있어요." },
  { term: "FOMC", alias: ["연준", "연방공개시장위원회"], def: "미국 중앙은행(연준)의 금리 결정 회의예요. 1년에 8번 열리고, 결과에 따라 전 세계 증시·환율이 움직여요." },
  { term: "금통위", alias: ["금융통화위원회"], def: "한국은행에서 기준금리를 정하는 회의예요. 1년에 8번 열려요." },
  { term: "환율", alias: ["달러", "원화"], def: "1달러를 사는 데 드는 원화 가격이에요. 환율이 오르면(원화 약세) 해외결제·여행 비용이 늘어요." },
  { term: "ETF", alias: ["상장지수펀드"], def: "여러 종목을 한 바구니에 담아 주식처럼 사고파는 펀드예요." },
  { term: "PER", alias: ["주가수익비율"], def: "주가를 주당순이익으로 나눈 값이에요. 낮을수록 버는 돈에 비해 주가가 싸다는 뜻이에요." },
  { term: "DSR", alias: ["총부채원리금상환비율"], def: "연 소득에서 모든 대출의 원금과 이자를 갚는 데 드는 비율이에요. 대출 한도를 정하는 기준이에요." },
  { term: "LTV", alias: ["담보인정비율"], def: "집값 대비 대출받을 수 있는 비율이에요. LTV 70%면 5억 집에 3억 5천까지 빌릴 수 있어요." },

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(n, dec = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return Number(n).toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function won(n) { // 원 단위 금액을 읽기 쉽게
  const a = Math.abs(n);
  if (a >= 1e8) return `${fmt(a / 1e8, a % 1e8 ? 1 : 0)}억원`;
  if (a >= 1e4) return `${fmt(a / 1e4, a < 1e5 ? 1 : 0)}만원`;
  return `${fmt(Math.round(a))}원`;
}
function man(m) { // 만원 단위 숫자 → "1억 2,000만원"
  if (m === null || m === undefined || m === "") return "-";
  const n = Math.round(Number(m));
  const eok = Math.floor(Math.abs(n) / 10000), rest = Math.abs(n) % 10000;
  const s = (eok ? `${eok}억` : "") + (rest ? `${eok ? " " : ""}${fmt(rest)}만` : "") + "원";
  return (n < 0 ? "-" : "") + (n === 0 ? "0원" : s);
}
function tone(v) { return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
function arrow(v) { return v > 0 ? "▲" : v < 0 ? "▼" : "-"; }
function pct(v) { return v === null || v === undefined ? "-" : `${arrow(v)} ${fmt(Math.abs(v), 2)}%`; }
function ymdLabel(s) { return s ? `${Number(s.slice(4, 6))}월 ${Number(s.slice(6, 8))}일` : ""; }
function josa(word, a, b) { // 받침 있으면 a, 없으면 b
  const c = String(word).charCodeAt(String(word).length - 1);
  if (c < 0xac00 || c > 0xd7a3) return b;
  return (c - 0xac00) % 28 ? a : b;
}
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function dayDiff(date) { return Math.round((date - today0()) / 86400e3); }
function greet() {
  const h = new Date().getHours();
  return h < 11 ? "좋은 아침이에요" : h < 18 ? "좋은 오후예요" : "좋은 저녁이에요";
}
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ───────────────────────── 데이터 불러오기 ─────────────────────────
async function getJson(url, opt) {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || r.status), { body: j });
  return j;
}

async function loadAll(manual = false) {
  if (!profile) return;
  data.loading = true;
  data.newsFull = null; // 관심사가 바뀌었을 수 있으니 더보기 목록은 다시 받는다
  const names = profile.watch.map((w) => w.name).join(",");
  const interests = [...profile.watch.map((w) => w.name).slice(0, 3), ...profile.prefs.slice(0, 3)].join(",");
  const jobs = [
    getJson(`/api/market?stocks=${encodeURIComponent(names)}`).then((j) => (data.market = j)).catch(() => {}),
    getJson(`/api/news?interests=${encodeURIComponent(interests)}`).then((j) => (data.news = j)).catch(() => {}),
  ];
  if (!data.calendar.length) jobs.push(getJson("/data/calendar.json").then((j) => (data.calendar = j.events || [])).catch(() => {}));
  if (!data.benefits.length) jobs.push(getJson("/data/benefits.json").then((j) => (data.benefits = j.items || [])).catch(() => {}));
  if (!data.rates) jobs.push(getJson("/api/rates").then((j) => (data.rates = j)).catch(() => {}));
  await Promise.all(jobs);
  data.loading = false;
  if (route() === "home") render();
  if (manual) toast(data.market ? `업데이트했어요 · ${ymdLabel(data.market.kospi?.date)} 종가 기준` : "불러오지 못했어요. 잠시 후 다시 시도해 주세요");
}

function marketMood() {
  const p = data.market?.kospi?.pct;
  if (p === undefined || p === null) return "확인 중";
  return p >= 0.7 ? "상승" : p <= -0.7 ? "하락" : "관망";
}
function biggestMover() {
  const list = (data.market?.stocks || []).filter((s) => !s.missing && s.pct !== null);
  return list.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct))[0];
}
function qtyOf(name) { return Number(profile.watch.find((w) => w.name === name)?.qty) || 0; }

// 금리 일정은 대출·종목·저축·부동산 관심이 있는 사람에게만
function interestTags() {
  const t = new Set(profile.prefs);
  if ((profile.debts || []).length || profile.watch.length || t.has("저축") || t.has("부동산")) t.add("금리");
  return t;
}
function upcoming(limit = 5) {
  const now = today0();
  const tags = interestTags();
  const list = [];
  for (const e of data.calendar) {
    if (e.tags && !e.tags.some((x) => tags.has(x))) continue;
    if (e.ageMax && profile.age && profile.age > e.ageMax) continue;
    let d;
    if (e.monthly) {
      d = new Date(now.getFullYear(), now.getMonth(), e.monthly);
      if (d < now) d.setMonth(d.getMonth() + 1);
    } else d = new Date(e.date + "T00:00:00");
    if (d < now || dayDiff(d) > 100) continue;
    list.push({ ...e, d, tag: (e.tags || []).find((x) => tags.has(x)) || "" });
  }
  // 내 일정: 월급날, 대출 이자일 (다음 한 번)
  const next = (day) => {
    const d = new Date(now.getFullYear(), now.getMonth(), Math.min(day, 28));
    if (d < now) d.setMonth(d.getMonth() + 1);
    return d;
  };
  if (profile.payday) list.push({ d: next(profile.payday), title: "월급날", tag: "내 일정", mine: true });
  (profile.debts || []).forEach((dbt) => {
    if (dbt.day) list.push({ d: next(dbt.day), title: `${dbt.name || "대출"} 이자 납부일`, tag: "내 일정", mine: true, note: dbt.amount && dbt.rate ? `약 ${won((dbt.amount * 1e4 * dbt.rate) / 100 / 12)}` : "" });
  });
  // 내 일정 → 관심사 확정 일정 → 관심사 예상 일정 → 금리 일정 순으로 자리를 채우고, 보여줄 때는 날짜순
  const rank = (e) => (e.mine ? 0 : e.tag === "금리" ? 3 : e.approx ? 2 : 1); // 확정 일정이 예상 일정보다 먼저
  const picked = list.sort((a, b) => rank(a) - rank(b) || a.d - b.d).slice(0, limit);
  return picked.sort((a, b) => a.d - b.d);
}

function matchedBenefits() {
  return data.benefits.filter((b) => {
    if (profile.age) {
      if (b.ageMin && profile.age < b.ageMin) return false;
      if (b.ageMax && profile.age > b.ageMax) return false;
    }
    if (b.incomeMax && profile.income && profile.income > b.incomeMax) return false;
    if (b.avertMax && profile.avert > b.avertMax) return false;
    return true;
  }).slice(0, 3);
}

function impacts() {
  const m = data.market, p = profile, out = [];
  if (!m) return out;
  if (m.usd) {
    const vs = m.usd.vs || 0, up = vs > 0;
    let text;
    if (!vs) text = "환율이 직전 고시와 같아요. 해외결제 비용 변화는 없어요.";
    else if (p.prefs.includes("여행")) text = `여행을 좋아하는 당신, 1,000달러를 환전하면 직전 고시보다 약 ${won(Math.abs(vs * 1000))} ${up ? "더 들어요" : "덜 들어요"}.`;
    else if (p.prefs.includes("쇼핑")) text = `쇼핑을 좋아하는 당신, 해외직구 100달러 결제 시 약 ${won(Math.abs(vs * 100))} ${up ? "더 내요" : "덜 내요"}.`;
    else text = up ? "수입품 가격과 해외결제 비용이 조금 오를 수 있어요." : "해외결제·수입품 비용 부담이 조금 줄어요.";
    out.push({ tag: `환율 ${arrow(vs)} ${fmt(m.usd.v, 1)}원`, tone: tone(vs), text });
  }
  const rateEvent = upcoming(20).find((e) => (e.tags || []).includes("금리"));
  const when = rateEvent ? `${rateEvent.d.getMonth() + 1}/${rateEvent.d.getDate()} ${rateEvent.title.includes("한국은행") ? "금통위" : "FOMC"}` : "다음 금리 결정";
  if (p.debts === null) {
    out.push({ tag: "금리", tone: "flat", text: "대출이 있다면 알려주세요. 금리가 바뀔 때 내 이자가 얼마나 달라지는지 계산해드려요.", act: "go-my" });
  } else {
    const variable = p.debts.filter((d) => d.kind === "변동").reduce((s, d) => s + (Number(d.amount) || 0), 0);
    let text;
    if (variable > 0) text = `${when}에서 금리가 0.25%p 오르면, 변동금리 대출 ${man(variable)}의 이자가 월 약 ${won((variable * 1e4 * 0.0025) / 12)} 늘어요.`;
    else if (p.debts.length) text = "대출이 고정금리라 금리가 바뀌어도 당장 이자는 그대로예요.";
    else if (p.assets.cash) text = `${when}에서 금리가 0.25%p 바뀌면, 예금 ${man(p.assets.cash)}의 1년 이자가 약 ${won(p.assets.cash * 1e4 * 0.0025)} 달라질 수 있어요.`;
    else text = "대출이 없으니 금리 변화는 예금·적금 이자 쪽으로 영향을 줘요.";
    out.push({ tag: rateEvent ? `금리 · ${when}` : "금리", tone: "flat", text });
  }
  const stocks = (m.stocks || []).filter((s) => !s.missing && s.vs !== null);
  const held = stocks.filter((s) => qtyOf(s.name) > 0);
  if (held.length) {
    const sum = held.reduce((t, s) => t + qtyOf(s.name) * s.vs, 0);
    out.push({ tag: `내 종목 ${sum >= 0 ? "▲" : "▼"}`, tone: tone(sum), text: `보유 종목 평가액이 전일보다 약 ${won(sum)} ${sum >= 0 ? "늘었어요" : "줄었어요"}.` });
  } else {
    const top = biggestMover();
    if (top) out.push({ tag: `${top.name} ${pct(top.pct)}`, tone: tone(top.pct), text: `관심 종목 중 ${top.name}${josa(top.name, "이", "가")} 가장 크게 움직였어요. 보유 수량을 넣으면 내 손익으로 보여드려요.`, act: "go-my" });
  }
  return out;
}

function bubbleLines() {
  const L = [];
  const name = profile.nickname || "오늘";
  const m = data.market;
  L.push({ text: `${esc(name)}님, ${greet()}! ${m ? `오늘 시장은 ‘${marketMood()}’ 분위기예요.` : "오늘 경제 소식을 모으고 있어요."}` });
  const top = biggestMover();
  if (top) L.push({ text: `관심 종목 ${esc(top.name)}${josa(top.name, "이", "가")} 전일보다 ${fmt(Math.abs(top.pct), 2)}% ${top.pct >= 0 ? "올랐어요" : "내렸어요"}.` });
  const fx = impacts()[0];
  if (fx && m?.usd) L.push({ text: `원/달러 환율은 ${fmt(m.usd.v, 1)}원이에요. ${fx.text}` });
  const ev = upcoming(5).find((e) => dayDiff(e.d) <= 14);
  if (ev) {
    const dd = dayDiff(ev.d);
    const when = ev.approx ? `곧(${esc(ev.when)})` : dd === 0 ? "오늘" : `${dd}일 뒤`;
    L.push({ text: `${when} ‘${esc(ev.title)}’ 일정이 있어요.${(ev.tags || []).includes("금리") ? " 발표 전후로 시장이 출렁일 수 있어요." : ""}` });
  }
  const b = matchedBenefits()[0];
  if (b) L.push({ text: `‘${esc(b.title)}’, ${esc(name)}님 조건에 맞을 수도 있어요. 아래 혜택 칸에서 확인해 보세요.` });
  L.push({ text: "궁금한 건 맨 위 검색창에 편하게 물어보세요!", act: "focus-ask" });
  return L;
}

function nextQuestion() {
  const p = profile, s = p.skipped || {};
  if (p.debts === null && !s.debts) return "debts";
  if (!p.income && !s.income) return "income";
  if (p.assets.cash === null && !s.cash) return "cash";
  if (!p.payday && !s.payday) return "payday";
  if (!p.gender && !s.gender) return "gender";
  return null;
}

function summaryForAi() {
  const p = profile;
  const debts = p.debts || [];
  return {
    profile: {

      riskType: riskType(p.avert), riskAversion: `${p.avert}/10`,

}

// 뉴스 제목을 몇 단어로 줄이기: [단독] 같은 머리말, 언론사 꼬리, 부제(… · - |) 떼고 22자 안팎에서 자르기
function shortTitle(t) {
  let s = String(t || "").replace(/^\s*(\[[^\]]*\]|【[^】]*】|<[^>]*>)\s*/g, "").replace(/\s*[-|]\s*[^-|]{2,12}$/, "");
  s = s.split(/…|\.\.\.|\s·\s|\s-\s|\s\|\s|,\s/)[0].trim() || s;
  if (s.length > 22) {
    const cut = s.slice(0, 22);
    const sp = cut.lastIndexOf(" ");
    s = (sp > 10 ? cut.slice(0, sp) : cut) + "…";
  }
  return s;
}
function newsLine(it) {
  return `<a href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.title)}">
    ${it.tag ? `<span class="badge b-green">${esc(it.tag)}</span>` : ""}<span class="t1">${esc(shortTitle(it.title))}</span><span class="src">${esc(it.source || "")}</span></a>`;
}
function newsList(items, numbered) { // 뉴스 더보기 화면: 제목 전체
  return (items || []).map((it, i) => `<a href="${esc(it.url)}" target="_blank" rel="noopener">
      ${numbered ? `<span class="no">${i + 1}</span>` : ""}
      <div style="flex:1"><div class="t">${esc(it.title)}</div><div class="m">${it.tag ? `<span class="badge b-green">${esc(it.tag)}</span>` : ""}<span>${esc(it.source || "")}</span>${it.at ? `<span>· ${ago(it.at)}</span>` : ""}</div></div></a>`).join("");
}
function tile(name, v, c, dec) {

}

async function openNews(tab) {
  ui.news.tab = tab;
  if (location.hash !== "#news") location.hash = "#news"; else render();
  const jobs = [];
  if (!data.newsFull) {
    const interests = [...profile.watch.map((w) => w.name).slice(0, 4), ...profile.prefs.slice(0, 3)].join(",");
    jobs.push(getJson(`/api/news?full=1&interests=${encodeURIComponent(interests)}`).then((j) => (data.newsFull = j)).catch(() => (data.newsFull = { issues: [], forYou: [] })));
  }
  if (tab.startsWith("kw:") && !ui.news.kwItems[tab.slice(3)]) {
    const k = tab.slice(3);
    jobs.push(getJson(`/api/news?full=1&q=${encodeURIComponent(k)}`).then((j) => (ui.news.kwItems[k] = j.items || [])).catch(() => (ui.news.kwItems[k] = [])));
  }
  await Promise.all(jobs);
  if (route() === "news") render();
}

  group("경제 용어", GLOSSARY.filter((g) => has(g.term) || (g.alias || []).some(has)).slice(0, 2)
    .map((g) => `<div class="si" style="padding-bottom:0"><b>${esc(g.term)}</b></div><div class="def">${esc(g.def)}</div>`));

  const pool = [...(data.news?.issues || []), ...(data.news?.forYou || []), ...(data.newsFull?.issues || []), ...(data.newsFull?.forYou || [])];
  const seen = new Set();
  const news = pool.filter((n) => has(n.title) && !seen.has(n.url) && seen.add(n.url)).slice(0, 3)
    .map((n) => `<a class="si" href="${esc(n.url)}" target="_blank" rel="noopener"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(shortTitle(n.title))}</span><span class="s2">${esc(n.source || "")}</span></a>`);
  news.push(`<button class="si" data-act="kw" data-k="${esc(q)}"><span>‘${esc(q)}’ 뉴스 더 보기</span><span class="s2">›</span></button>`);
  group("뉴스", news);

  group("일정", data.calendar.filter((e) => has(e.title) || (e.tags || []).some(has)).slice(0, 3)
    .map((e) => `<div class="si"><span>${esc(e.title)}</span><span class="s2">${esc(e.approx ? e.when : e.monthly ? `매달 ${e.monthly}일` : `${Number(e.date.slice(5, 7))}/${Number(e.date.slice(8, 10))}`)}</span></div>`));

  group("혜택·정책", data.benefits.filter((b) => has(b.title) || has(b.desc) || has(b.tag)).slice(0, 3)
    .map((b) => `<a class="si" href="${esc(b.url)}" target="_blank" rel="noopener"><span>${esc(b.title)}</span><span class="s2">${esc(b.tag)} ${ICON.out}</span></a>`));

  group("메뉴", MENU.filter((x) => has(x.label) || x.keys.some((k) => k.includes(q) || q.includes(k))).slice(0, 3)
    .map((x) => `<button class="si" data-act="go-my" data-focus="${x.focus}"><span>${esc(x.label)}</span><span class="s2">마이페이지 ›</span></button>`));

  out.push(`<button class="si ask" data-act="ask" data-q="${esc(q)}"><span style="display:flex;align-items:center;gap:8px">${mascot(22)} 캐릭터에게 ‘${esc(q.length > 16 ? q.slice(0, 16) + "…" : q)}’ 물어보기</span><span>›</span></button>`);
  return out.join("");
}
function refreshResults() {
  const box = document.getElementById("sresults");
  if (box) box.innerHTML = searchResults();
}

async function askAi(q) {
  ui.sheet = { q, loading: true };
  ui.q = ""; ui.sremote = []; ui.searchOpen = false;
  render();
  try {
    const j = await getJson("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, ...summaryForAi() }) });
    ui.sheet = { q, a: j.answer || "답을 만들지 못했어요." };
  } catch (err) {
    ui.sheet = { q, a: err.body?.error || "지금은 답할 수 없어요. 잠시 후 다시 시도해 주세요." };
  }
  if (ui.sheet) render();
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `${Math.max(min, 1)}분 전`;
  if (min < 1440) return `${Math.round(min / 60)}시간 전`;
  return `${Math.round(min / 1440)}일 전`;
}

  const skip = `<button class="link-btn" style="padding-left:0;color:var(--sub)" data-act="skip" data-k="${k}">나중에 할게요</button>`;
  const head = `<span class="hint">알려주면 더 맞춰드려요 · 이 기기에만 저장돼요</span>`;
  if (k === "debts") return `${head}<p class="q">혹시 대출이 있나요?</p>
    <div class="inline"><button class="btn ghost" data-act="no-debt" style="flex:1">없어요</button><button class="btn" data-act="go-my" data-focus="debts" style="flex:1">있어요, 입력할게요</button></div>${skip}`;
  if (k === "income") return `${head}<p class="q">연 소득은 어느 구간인가요? (혜택 추천에 써요)</p>
    <div class="chips">${INCOME.slice(1).map((t, i) => `<button class="chip" data-act="set-income" data-v="${i + 1}">${t}</button>`).join("")}</div>${skip}`;
  if (k === "cash") return `${head}<p class="q">예금·현금은 대략 얼마나 있나요?</p>
    <div class="inline"><div class="money" style="flex:1"><label for="q-cash" class="sr">예금·현금 (만원)</label><input class="field num" id="q-cash" inputmode="numeric" placeholder="예: 3000"><span class="unit">만원</span></div><button class="btn" data-act="set-cash">저장</button></div>${skip}`;
  if (k === "payday") return `${head}<p class="q">월급날이 있다면 며칠인가요? 캘린더에 넣어드려요</p>
    <div class="inline"><div class="money" style="flex:1"><label for="q-pay" class="sr">월급날 (일)</label><input class="field num" id="q-pay" inputmode="numeric" placeholder="예: 25"><span class="unit">일</span></div><button class="btn" data-act="set-payday">저장</button></div>${skip}`;
  if (k === "gender") return `${head}<p class="q">성별을 알려주실래요? (선택)</p>

function viewMy() {
  const p = profile;
  const hide = ui.hideMoney;
  const a = p.assets;
  const debts = p.debts || [];
  const total = (Number(a.cash) || 0) + (Number(a.invest) || 0) + (Number(a.other) || 0);
  const debtSum = debts.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const net = total - debtSum;
  const hasAssets = a.cash !== null || a.invest !== null || a.other !== null;
  const money = (v) => (hide ? "••••" : man(v));

  // 자산 진단 (입력한 값만으로 계산, 일반적인 기준)
  const diag = [];
  if (hasAssets) {
    const dr = total ? (debtSum / total) * 100 : debtSum ? 100 : 0;
    diag.push(dr < 20 ? ["b-green", "부채", `자산 대비 부채가 ${fmt(dr)}%로 건전한 편이에요.`]
      : dr < 50 ? ["b-flat", "부채", `자산 대비 부채가 ${fmt(dr)}%예요. 금리가 오를 때 이자 부담을 같이 봐두세요.`]
      : ["b-up", "부채", `자산 대비 부채가 ${fmt(dr)}%로 높은 편이에요. 금리가 높은 대출부터 줄이는 걸 고민해 보세요.`]);
    if (p.income) {
      const need = INCOME_MONTHLY[p.income] * 3;
      diag.push((Number(a.cash) || 0) >= need ? ["b-green", "비상금", `예금·현금이 월 소득 3개월치(약 ${man(need)}) 이상이라 비상금은 충분해요.`]
        : ["b-up", "비상금", `비상금은 보통 월 소득 3~6개월치를 권해요. 약 ${man(need)}을 목표로 잡아보세요.`]);
    } else diag.push(["b-flat", "비상금", "소득 구간을 넣으면 비상금이 충분한지 알려드려요."]);
    if (total) {
      const ir = ((Number(a.invest) || 0) / total) * 100;
      const [lo, hi] = investGuide(p.avert);
      diag.push(ir < lo ? ["b-down", "성향", `투자자산 비중이 ${fmt(ir)}%예요. ${riskType(p.avert)}에 흔한 비중(${lo}~${hi}%)보다 보수적으로 운용 중이에요.`]
        : ir > hi ? ["b-up", "성향", `투자자산 비중이 ${fmt(ir)}%예요. ${riskType(p.avert)}에 흔한 비중(${lo}~${hi}%)보다 공격적이에요.`]
        : ["b-green", "성향", `투자자산 비중 ${fmt(ir)}%로 ${riskType(p.avert)}에 맞게 운용 중이에요.`]);
    }
    const variable = debts.filter((d) => d.kind === "변동").reduce((s, d) => s + (Number(d.amount) || 0), 0);
    if (variable) diag.push(["b-flat", "금리", `변동금리 대출 ${man(variable)}은 금리가 0.25%p 오르면 월 이자가 약 ${won((variable * 1e4 * 0.0025) / 12)} 늘어요.`]);
  }
  const seg = (v, c) => (total && v ? `<div style="width:${(v / total) * 100}%;background:${c}"></div>` : "");

  const watchRows = p.watch.map((w, i) => `<div class="row">
      <span class="name" style="flex:1">${esc(w.name)}</span>
      <div class="money" style="width:110px"><label for="qty-${i}" class="sr">${esc(w.name)} 보유 수량</label><input class="field num" id="qty-${i}" inputmode="numeric" placeholder="보유 수량" data-field="qty" data-i="${i}" value="${w.qty ?? ""}"><span class="unit">주</span></div>
      <button class="icon-btn" data-act="rm-watch" data-i="${i}" aria-label="${esc(w.name)} 삭제">${ICON.x}</button></div>`).join("");

  const debtRows = debts.map((d, i) => `<div class="debt">
      <div class="inline"><label for="dn-${i}" class="sr">대출 이름</label><input class="field" id="dn-${i}" placeholder="대출 이름 (예: 신용대출)" data-field="debt-name" data-i="${i}" value="${esc(d.name || "")}">
        <button class="icon-btn" data-act="rm-debt" data-i="${i}" aria-label="대출 삭제">${ICON.x}</button></div>
      <div class="grid2">
        <div class="money"><label for="da-${i}" class="sr">대출 잔액 (만원)</label><input class="field num" id="da-${i}" inputmode="numeric" placeholder="잔액" data-field="debt-amount" data-i="${i}" value="${d.amount ?? ""}"><span class="unit">만원</span></div>
        <div class="money"><label for="dr-${i}" class="sr">금리 (%)</label><input class="field num" id="dr-${i}" inputmode="decimal" placeholder="금리" data-field="debt-rate" data-i="${i}" value="${d.rate ?? ""}"><span class="unit">%</span></div>
        <div><label for="dk-${i}" class="sr">금리 종류</label><select class="field" id="dk-${i}" data-field="debt-kind" data-i="${i}">${["변동", "고정"].map((k) => `<option ${d.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select></div>
        <div class="money"><label for="dd-${i}" class="sr">이자 납부일</label><input class="field num" id="dd-${i}" inputmode="numeric" placeholder="이자일" data-field="debt-day" data-i="${i}" value="${d.day ?? ""}"><span class="unit">일</span></div>
      </div></div>`).join("");

  return `
  <header class="page-head">
    <button class="icon-btn" data-act="go-home" aria-label="홈으로">${ICON.back}</button>
    <h1>마이페이지</h1>
  </header>
  <main class="scroll">
    <section class="card" style="display:flex;align-items:center;gap:14px">
      ${mascot(56)}
      <div style="flex:1"><div style="font-size:18px;font-weight:700">${esc(p.nickname || "이름 없음")}님</div>
      <div class="hint">${p.age ? `만 ${p.age}세 · ` : ""}${riskType(p.avert)} · ${p.prefs.map(esc).join(", ") || "선호 미입력"}</div></div>
    </section>

    <section class="card" id="sec-diag">
      <div class="sec-title"><h2>내 자산 진단</h2><button class="link-btn" data-act="toggle-hide">${hide ? "금액 보이기" : "금액 숨기기"}</button></div>
      ${hasAssets ? `
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="hint">순자산</span><span class="num" style="font-size:24px;font-weight:700">${money(net)}</span></div>
        <div class="bar" aria-hidden="true">${seg(Number(a.cash) || 0, "#1C7C54")}${seg(Number(a.invest) || 0, "#FFB020")}${seg(Number(a.other) || 0, "#8FB3A0")}</div>
        <div class="legend" style="margin:8px 0 12px"><span><i style="background:#1C7C54"></i>예금·현금 ${money(a.cash || 0)}</span><span><i style="background:#FFB020"></i>투자 ${money(a.invest || 0)}</span><span><i style="background:#8FB3A0"></i>기타 ${money(a.other || 0)}</span><span>부채 ${money(debtSum)}</span></div>
        <div class="diag">${diag.map(([c, t, s]) => `<div class="diag-line"><span class="badge ${c}">${t}</span><span>${esc(s)}</span></div>`).join("")}</div>
        <p class="hint" style="margin:12px 0 0">입력한 값으로 계산한 일반적인 참고 기준이에요. 투자 권유가 아니에요.</p>`
      : `<p class="hint" style="margin:0">아래에 자산을 입력하면 진단해드려요.</p>`}
    </section>

    <section class="card form" id="sec-basic">
      <div class="sec-title"><h2>기본 정보</h2></div>
      <div class="grid2">
        <div><label class="lb" for="f-nick">닉네임</label><input class="field" id="f-nick" data-field="nickname" value="${esc(p.nickname)}" maxlength="12"></div>
        <div><label class="lb" for="f-age">만 나이</label><input class="field num" id="f-age" inputmode="numeric" data-field="age" value="${p.age ?? ""}"></div>

        <div><label class="lb" for="f-income">연 소득</label><select class="field" id="f-income" data-field="income">${INCOME.map((t, i) => `<option value="${i}" ${(p.income || 0) === i ? "selected" : ""}>${t || "선택 안 함"}</option>`).join("")}</select></div>
      </div>

        ${p.customLetters.map((l, i) => `<span class="chip on">${esc(l.name)}<button class="icon-btn" style="width:28px;height:28px;color:#fff" data-act="rm-letter" data-i="${i}" aria-label="${esc(l.name)} 삭제">${ICON.x}</button></span>`).join("")}</div>

function stockResults() {
  const s = ui.search;
  const have = new Set(target().watch.map((w) => w.name));
  const pop = POPULAR.filter((n) => !have.has(n));
  return `${s.results.length ? `<div class="results" style="margin-top:6px">${s.results.map((r) => `<button data-act="add-watch" data-v="${esc(r.name)}"${have.has(r.name) ? " disabled" : ""}><span>${esc(r.name)}</span><span class="hint">${esc(r.market || "")} ${have.has(r.name) ? "추가됨" : "+ 추가"}</span></button>`).join("")}</div>`
        : s.q && s.sample ? `<p class="hint">시세 키를 연결하면 검색돼요. 아래 인기 종목에서 골라보세요.</p>` : ""}
      ${pop.length ? `<div class="chips" style="margin-top:10px"><span class="hint">인기</span>${pop.map((n) => `<button class="chip small" data-act="add-watch" data-v="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>` : ""}`;
}
function stockSearch() {
  return `<div>
      <label class="lb" for="stock-q">종목 검색</label>
      <input class="field" id="stock-q" placeholder="종목 이름 (예: 삼성)" autocomplete="off" value="${esc(ui.search.q)}" data-search="1">
      <div id="stock-results">${stockResults()}</div>
    </div>`;
}

// ───────────────────────── 화면: 첫 설문 (3단계) ─────────────────────────
function viewOnboard() {
  const st = ui.onb.step;
  const d = ui.onb.draft || (ui.onb.draft = newProfile());
  const steps = `<div class="steps" aria-label="${st + 1}/3 단계">${[0, 1, 2].map((i) => `<i class="${i <= st ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (st === 0) body = `
    <div style="display:flex;align-items:center;gap:12px">${mascot(64)}<p class="hand" style="margin:0;font-size:17px;line-height:1.6">안녕하세요! 오늘부터 경제 소식을<br>당신 상황에 맞춰 알려드릴게요.</p></div>
    <h1>먼저, 뭐라고 불러드릴까요?</h1>
    <div class="form">
      <div><label class="lb" for="o-nick">닉네임</label><input class="field" id="o-nick" maxlength="12" data-o="nickname" value="${esc(d.nickname)}" placeholder="예: 은채"></div>
      <div><label class="lb" for="o-age">만 나이</label><input class="field num" id="o-age" inputmode="numeric" data-o="age" value="${d.age ?? ""}" placeholder="예: 24"></div>
    </div>`;
  if (st === 1) body = `
    <h1>관심 있는 종목을<br>골라주세요</h1>
    <p class="hint" style="margin:-8px 0 0">홈에서 가격과 등락을 바로 보여드려요. 나중에 바꿀 수 있어요.</p>
    <div class="chips">${d.watch.map((w, i) => `<span class="chip on">${esc(w.name)}<button class="icon-btn" style="width:28px;height:28px;color:#fff" data-act="rm-watch" data-i="${i}" aria-label="${esc(w.name)} 빼기">${ICON.x}</button></span>`).join("") || `<span class="hint">아직 고른 종목이 없어요</span>`}</div>
    ${stockSearch()}`;
  if (st === 2) body = `
    <h1>마지막으로,<br>당신의 성향을 알려주세요</h1>
    <div class="card form">
      <label class="lb" for="o-avert">위험을 얼마나 피하고 싶나요? <b class="num" id="avert-val" style="color:var(--ink)">${d.avert}/10</b> · <span class="type-pill" id="avert-type">${riskType(d.avert)}</span></label>
      <input class="range" id="o-avert" type="range" min="1" max="10" step="1" value="${d.avert}" data-o="avert">
      <div class="range-ends"><span>1 · 위험 괜찮아요</span><span>10 · 손실은 싫어요</span></div>
    </div>
    <div class="card form">
      <span class="lb">무엇에 가치를 두나요? (여러 개)</span>
      <div class="chips">${PREFS.map((x) => `<button class="chip ${d.prefs.includes(x) ? "on" : ""}" data-act="pref" data-v="${x}" aria-pressed="${d.prefs.includes(x)}">${x}</button>`).join("")}</div>
    </div>
    <div class="card form">
      <span class="lb">구독 중인 뉴스레터가 있나요?</span>
      <div class="chips">${LETTERS.map((l) => `<button class="chip ${d.letters.includes(l.id) ? "on" : ""}" data-act="letter" data-v="${l.id}" aria-pressed="${d.letters.includes(l.id)}">${l.name} · ${l.by}</button>`).join("")}</div>
    </div>
    <p class="hint" style="margin:0">자산·대출·소득은 홈에서 하나씩 천천히 여쭤볼게요.</p>`;
  const canNext = st === 0 ? d.nickname.trim() && d.age > 0 : true;
  return `<main class="onb">${steps}${body}
    <div style="margin-top:auto;display:flex;gap:8px">
      ${st > 0 ? `<button class="btn ghost block" style="flex:0 0 96px" data-act="onb-back">이전</button>` : ""}
      <button class="btn block" data-act="onb-next" ${canNext ? "" : "disabled"}>${st === 2 ? "시작하기" : "다음"}</button>
    </div></main>`;
}

// ───────────────────────── 라우팅 / 그리기 ─────────────────────────
function route() {
  if (!profile) return "onboard";
  return location.hash === "#my" ? "my" : location.hash === "#news" ? "news" : "home";
}
function render() {
  const r = route();
  const app = document.getElementById("app");
  const y = window.scrollY;
  const focusId = document.activeElement?.id;
  app.innerHTML = r === "onboard" ? viewOnboard() : r === "my" ? viewMy() : r === "news" ? viewNews() : viewHome();
  window.scrollTo(0, y);
  if (focusId) document.getElementById(focusId)?.focus();
}
function go(hash) {
  if (location.hash === hash || (!location.hash && hash === "#home")) { render(); window.scrollTo(0, 0); }
  else location.hash = hash;
}
window.addEventListener("hashchange", () => { ui.search = { q: "", results: [], sample: false }; ui.searchOpen = false; render(); window.scrollTo(0, 0); });

// 지금 편집 중인 프로필 (첫 설문 중이면 초안)
function target() { return profile || ui.onb.draft; }
function commit() { if (profile) saveProfile(); render(); }

// ───────────────────────── 이벤트 ─────────────────────────
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-back") && e.target.closest("[data-stop]")) return; // 시트 안쪽 클릭은 닫지 않음
  const act = el.dataset.act;
  const t = target();

  switch (act) {
    case "go-my":
      go("#my");
      if (el.dataset.focus) setTimeout(() => document.getElementById("sec-" + el.dataset.focus)?.scrollIntoView({ behavior: "smooth" }), 50);
      break;
    case "go-home": go("#home"); break;
    case "refresh": loadAll(true); break;
    case "next-line": ui.bubble++; render(); break;
    case "focus-ask": window.scrollTo(0, 0); document.getElementById("q")?.focus(); break;
    case "ask": askAi(el.dataset.q); break;
    case "news-more": openNews("issues"); break;
    case "news-tab": openNews(el.dataset.t); break;
    case "add-watch-s": {
      const v = el.dataset.v;
      if (profile.watch.length >= 10) { toast("관심 종목은 10개까지예요"); break; }
      profile.watch.push({ name: v, qty: null }); saveProfile();
      ui.q = ""; ui.sremote = []; ui.searchOpen = false; render(); loadAll();
      toast(`${v}${josa(v, "을", "를")} 관심 종목에 추가했어요`);
      break;
    }
    case "kw": ui.q = ""; ui.searchOpen = false; openNews("kw:" + el.dataset.k); break;
    case "quiz": ui.quiz = { day: Number(el.dataset.day), pick: el.dataset.o }; saveUi(); render(); break;
    case "close-sheet": ui.sheet = null; render(); break;
    case "skip": t.skipped = { ...(t.skipped || {}), [el.dataset.k]: true }; commit(); break;
    case "no-debt": t.debts = []; commit(); toast("대출 없음으로 저장했어요"); break;
    case "set-income": t.income = Number(el.dataset.v); commit(); break;
    case "set-gender": t.gender = el.dataset.v; commit(); break;
    case "set-cash": {
      const v = parseInt(document.getElementById("q-cash").value.replace(/[^0-9]/g, ""), 10);
      if (Number.isFinite(v)) { t.assets.cash = v; commit(); toast("마이페이지에서 자산 진단을 볼 수 있어요"); }
      break;
    }
    case "set-payday": {
      const v = parseInt(document.getElementById("q-pay").value, 10);
      if (v >= 1 && v <= 31) { t.payday = v; commit(); }
      break;
    }
    case "toggle-hide": ui.hideMoney = !ui.hideMoney; saveUi(); render(); break;
    case "pref": {
      const v = el.dataset.v;
      t.prefs = t.prefs.includes(v) ? t.prefs.filter((x) => x !== v) : [...t.prefs, v];
      commit();
      if (profile) data.news = null, loadAll();
      break;
    }
    case "letter": {
      const v = el.dataset.v;
      t.letters = t.letters.includes(v) ? t.letters.filter((x) => x !== v) : [...t.letters, v];
      commit(); break;
    }
    case "add-letter": {
      const name = document.getElementById("f-ln").value.trim();
      let url = document.getElementById("f-lu").value.trim();
      if (!name || !url) { toast("이름과 주소를 모두 적어주세요"); break; }
      if (!/^https?:\/\//.test(url)) url = "https://" + url;
      t.customLetters.push({ name: name.slice(0, 20), url }); commit(); break;
    }
    case "rm-letter": t.customLetters.splice(Number(el.dataset.i), 1); commit(); break;
    case "add-watch": {
      const v = el.dataset.v;
      if (!t.watch.some((w) => w.name === v)) {
        if (t.watch.length >= 10) { toast("관심 종목은 10개까지예요"); break; }
        t.watch.push({ name: v, qty: null });
      }
      ui.search = { q: "", results: [], sample: false };
      commit();
      if (profile) loadAll();
      break;
    }
    case "rm-watch": t.watch.splice(Number(el.dataset.i), 1); commit(); if (profile) loadAll(); break;
    case "add-debt": t.debts = [...(t.debts || []), { name: "", amount: null, rate: null, kind: "변동", day: null }]; commit(); break;
    case "rm-debt": t.debts.splice(Number(el.dataset.i), 1); commit(); break;
    case "wipe":
      if (confirm("이 기기에 저장된 내 정보를 모두 지울까요? 되돌릴 수 없어요.")) {
        try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(UI_KEY); } catch {}
        profile = null; ui.onb = { step: 0, draft: null }; location.hash = ""; render();
      }
      break;
    case "onb-back": ui.onb.step--; ui.search = { q: "", results: [], sample: false }; render(); break;
    case "onb-next":
      if (ui.onb.step < 2) { ui.onb.step++; ui.search = { q: "", results: [], sample: false }; render(); window.scrollTo(0, 0); }
      else { profile = ui.onb.draft; saveProfile(); ui.onb = { step: 0, draft: null }; location.hash = ""; render(); loadAll(); }
      break;
  }
});

// 값 입력 (바꾼 뒤 칸을 벗어날 때 저장)
document.addEventListener("change", (e) => {
  const el = e.target;
  const f = el.dataset.field;
  if (!f || !profile) return;
  const p = profile;
  const int = (v) => { const n = parseInt(String(v).replace(/[^0-9-]/g, ""), 10); return Number.isFinite(n) ? n : null; };
  const i = Number(el.dataset.i);
  if (f === "nickname") p.nickname = el.value.trim().slice(0, 12);
  else if (f === "age") p.age = int(el.value);
  else if (f === "gender") p.gender = el.value;
  else if (f === "income") p.income = Number(el.value) || null;
  else if (f === "avert") p.avert = Number(el.value);
  else if (["cash", "invest", "other"].includes(f)) p.assets[f] = int(el.value);
  else if (f === "payday") { const d = int(el.value); p.payday = d >= 1 && d <= 31 ? d : null; }
  else if (f === "qty") p.watch[i].qty = int(el.value);
  else if (f === "debt-name") p.debts[i].name = el.value.trim().slice(0, 20);
  else if (f === "debt-amount") p.debts[i].amount = int(el.value);
  else if (f === "debt-rate") { const r = parseFloat(el.value); p.debts[i].rate = Number.isFinite(r) ? r : null; }
  else if (f === "debt-kind") p.debts[i].kind = el.value;
  else if (f === "debt-day") { const d = int(el.value); p.debts[i].day = d >= 1 && d <= 31 ? d : null; }
  saveProfile();
  render();
});

// 슬라이더를 끄는 동안엔 화면을 다시 그리지 않고 숫자만 바꾼다 (다시 그리면 드래그가 끊김)
function showAvert(v) {
  const a = document.getElementById("avert-val"), b = document.getElementById("avert-type");
  if (a) a.textContent = `${v}/10`;
  if (b) b.textContent = riskType(v);
}

let searchTimer, remoteTimer;
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "q") {
    ui.q = el.value;
    refreshResults();
    clearTimeout(remoteTimer);
    const q = el.value.trim();
    ui.sremote = [];
    if (q.length >= 2) remoteTimer = setTimeout(async () => {
      try {
        const j = await getJson(`/api/market?search=${encodeURIComponent(q)}`);
        if (ui.q.trim() === q) { ui.sremote = j.results || []; refreshResults(); }
      } catch {}
    }, 350);
    return;
  }
  if (el.dataset.o) { // 첫 설문 입력
    const d = ui.onb.draft;
    if (el.dataset.o === "nickname") d.nickname = el.value.slice(0, 12);
    if (el.dataset.o === "age") d.age = parseInt(el.value, 10) || null;
    if (el.dataset.o === "avert") { d.avert = Number(el.value); showAvert(d.avert); return; }
    const btn = document.querySelector('[data-act="onb-next"]');
    if (btn) btn.disabled = !(d.nickname.trim() && d.age > 0);
    return;
  }
  if (el.dataset.field === "avert") { showAvert(Number(el.value)); return; } // 저장은 손을 뗄 때(change)
  if (el.dataset.search) {
    ui.search.q = el.value;
    clearTimeout(searchTimer);
    const q = el.value.trim();
    const paint = () => { const box = document.getElementById("stock-results"); if (box) box.innerHTML = stockResults(); };
    if (!q) { ui.search.results = []; paint(); return; }
    searchTimer = setTimeout(async () => {
      try {
        const j = await getJson(`/api/market?search=${encodeURIComponent(q)}`);
        if (ui.search.q.trim() !== q) return;
        ui.search.results = j.results || []; ui.search.sample = !!j.sample;
      } catch { ui.search.results = []; }
      paint();
    }, 300);
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "searchform") return;
  e.preventDefault();
  const q = ui.q.trim();
  if (!q) return;
  // 질문처럼 보이거나 앱 안에서 찾은 게 없으면 바로 캐릭터에게 물어본다
  const found = document.querySelectorAll("#sresults .si:not(.ask)").length > 1;
  if (/[?？]$|뭐|어떻게|왜|할까|될까|얼마/.test(q) || !found) askAi(q);
  else document.getElementById("q")?.blur();
});

document.addEventListener("focusin", (e) => {
  if (e.target.id === "q") { ui.searchOpen = true; document.getElementById("searchwrap")?.classList.add("open"); }
});
document.addEventListener("pointerdown", (e) => {
  if (ui.searchOpen && !e.target.closest("#searchwrap")) { ui.searchOpen = false; document.getElementById("searchwrap")?.classList.remove("open"); }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && ui.sheet) { ui.sheet = null; render(); }
  else if (e.key === "Escape" && ui.searchOpen) { ui.searchOpen = false; document.getElementById("searchwrap")?.classList.remove("open"); document.getElementById("q")?.blur(); }
});

render();
loadAll();
</script>
</body>
</html>
